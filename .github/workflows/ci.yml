name: SIGEH CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analisis:
    name: Analisis del proyecto SIGEH
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Contar archivos Java
        run: find src -name "*.java" | wc -l

      - name: Contar lineas de codigo
        run: find src -name "*.java" -exec wc -l {} + | tail -1

      - name: Listar clases del sistema
        run: find src -name "*.java" -exec basename {} .java ";"

      - name: Resumen
        run: echo "SIGEH - SoftHealth Solutions S.A.S."
